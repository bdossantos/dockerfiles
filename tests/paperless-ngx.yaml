schemaVersion: '2.0.0'

fileExistenceTests:
  - name: 'manage.py exists'
    path: '/app/manage.py'
    shouldExist: true
    uid: 0
    gid: 0
  - name: 'ImageMagick distro policy exists'
    path: '/etc/ImageMagick-7/policy.xml'
    shouldExist: true
    uid: 0
    gid: 0
  - name: 'nltk stopwords corpus exists'
    path: '/usr/share/nltk_data/corpora/stopwords'
    shouldExist: true
  - name: 'nltk punkt_tab tokenizer exists'
    path: '/usr/share/nltk_data/tokenizers/punkt_tab'
    shouldExist: true

commandTests:
  - name: 'nltk resources are usable'
    command: 'python3'
    args:
      - '-c'
      - "from nltk.corpus import stopwords; from nltk.tokenize import word_tokenize; assert 'the' in stopwords.words('english'); assert word_tokenize('Hello world.') == ['Hello', 'world', '.']"
    exitCode: 0
  - name: 'ImageMagick loads the distro policy'
    command: 'convert'
    args: ['-list', 'policy']
    expectedOutput:
      - 'Path: /etc/ImageMagick-7/policy.xml'
    exitCode: 0

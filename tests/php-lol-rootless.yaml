schemaVersion: '2.0.0'

fileExistenceTests:
  - name: 'nginx binary exists'
    path: '/usr/sbin/nginx'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'php binary exists'
    path: '/usr/local/bin/php'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'php-fpm binary exists'
    path: '/usr/local/sbin/php-fpm'

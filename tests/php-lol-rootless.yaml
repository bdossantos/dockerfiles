    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'php.ini exists'
    path: '/usr/local/etc/php/php.ini'
    shouldExist: true
    permissions: '-r--r--r--'
    uid: 0
    gid: 0

  - name: 'apcu config exists'

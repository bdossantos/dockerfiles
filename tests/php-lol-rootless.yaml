    path: '/usr/share/GeoIP/GeoIPv6.dat'
    shouldExist: true
    permissions: '-rw-r--r--'

commandTests:
  - name: 'apcu config checksum'
    command: 'sha256sum'
    args: ['/usr/local/etc/php/conf.d/zzz-apcu.ini']
    expectedOutput:
      - 'db8d511610fd562151560c67707d4712900164b371687e4cb75f15f6fd62a9d6'

  - name: 'opcache config checksum'
    command: 'sha256sum'
    args: ['/usr/local/etc/php/conf.d/zzz-opcache.ini']
    expectedOutput:
      - 'f37b923b4f54a8062782cef3cd260ea5cdac5b9f5cfa2a17915168dd17e7a433'

  - name: 'php-fpm tuning config checksum'
    command: 'sha256sum'
    args: ['/usr/local/etc/php-fpm.d/zzz-php-fpm-tuning.conf']
    expectedOutput:
      - '3832a8a0902e318692ddee03be0a1d85d0ec8247388dac04863eff46313fe867'

  - name: 'php hardening config checksum'
    command: 'sha256sum'
    args: ['/usr/local/etc/php/conf.d/zzz-php-hardening.ini']
    expectedOutput:
      - '489ba97dca079d84e7dc21afb68b0acf7954da8ad150279be70053dce7243f83'

  - name: 'nginx.conf checksum'
    command: 'sha256sum'
    args: ['/etc/nginx/nginx.conf']
    expectedOutput:
      - '5781e761d4fff195797e1461fb85b3e5381fb6f0eef5e6e7463ec9f3b96f399b'

  - name: 'nginx mime.types checksum'
    command: 'sha256sum'
    args: ['/etc/nginx/mime.types']
    expectedOutput:
      - 'ac27e1f587ecebc46ded3265479efdc6cb2f711c22e8221dadb00b7b4db55369'

  - name: 'supervisord.conf checksum'
    command: 'sha256sum'
    args: ['/etc/supervisor/supervisord.conf']
    expectedOutput:
      - '7c1b6af616372d69f9beb279834b4b9bab0deb31ed454a21193b563817bf9304'

  - name: 'supervisor app.conf checksum'
    command: 'sha256sum'
    args: ['/etc/supervisor/conf.d/app.conf']
    expectedOutput:
      - 'ffaca82839725c81b62f59a5da6fc941f2643eee5e649654725e01c80b28b1b4'

  - name: 'default user uid is nobody'
    command: 'id'
    args: ['-u']
    exitCode: 0
    expectedOutput: ['65534']

  - name: 'default user gid is nogroup'
    command: 'id'
    args: ['-g']
    exitCode: 0
    expectedOutput: ['65534']

  - name: 'rootless supervisord can start services'
    command: 'sh'
    args:
      - '-ceu'
      - |
        /usr/bin/supervisord -c /etc/supervisor/supervisord.conf &
        pid=$!
        trap 'kill "$pid"' EXIT
        for _ in 1 2 3 4 5; do
          if /usr/bin/supervisorctl status >/dev/shm/supervisor-status; then
            break
          fi
          sleep 1
        done
        grep -E '^php-fpm\\s+RUNNING' /dev/shm/supervisor-status
        grep -E '^nginx\\s+RUNNING' /dev/shm/supervisor-status
    exitCode: 0

  - name: 'php-fpm config test'
    command: '/usr/local/sbin/php-fpm'
    args: ['-t']
    exitCode: 0

  - name: 'nginx config test'
    command: '/usr/sbin/nginx'
    args: ['-t']
    exitCode: 0
    expectedError:
      - 'nginx: the configuration file /etc/nginx/nginx.conf syntax is ok'
      - 'nginx: configuration file /etc/nginx/nginx.conf test is successful'


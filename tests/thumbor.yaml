schemaVersion: '2.0.0'

# The image is distroless: no shell, no sha256sum, no dpkg. Tests therefore
# only use exec-form commands and file checks.

metadataTest:
  user: '65534:65534'
  exposedPorts: ['8000', '8888']
  entrypoint: ['/usr/bin/python3', '/app/bin/thumbor']

fileExistenceTests:
  - name: 'thumbor binary exists'
    path: '/app/bin/thumbor'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'thumbor config exists'
    path: '/etc/thumbor/thumbor.conf'
    shouldExist: true
    permissions: '-r--r--r--'
    uid: 65534
    gid: 65534

  - name: 'jpegtran binary exists'
    path: '/usr/bin/jpegtran'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'gifsicle binary exists'
    path: '/usr/bin/gifsicle'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'ffmpeg binary exists'
    path: '/usr/bin/ffmpeg'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

  - name: 'no shell in the image'
    path: '/bin/sh'
    shouldExist: false

  - name: 'no apt in the image'
    path: '/usr/bin/apt-get'
    shouldExist: false

commandTests:
  - name: 'thumbor and its native extensions can be imported'
    command: '/usr/bin/python3'
    args:
      - '-c'
      - 'import thumbor, cv2, numpy, PIL, pillow_avif, pycurl, cairosvg, tc_prometheus, thumbor_plugins'
    exitCode: 0

  - name: 'thumbor-doctor runs successfully'
    command: '/usr/bin/python3'
    args: ['/app/bin/thumbor-doctor']
    exitCode: 0

  - name: 'jpegtran runs'
    command: '/usr/bin/jpegtran'
    args: ['-version']
    exitCode: 0

  - name: 'gifsicle runs'
    command: '/usr/bin/gifsicle'
    args: ['--version']
    exitCode: 0
    expectedOutput: ['LCDF Gifsicle']

  - name: 'ffmpeg runs'
    command: '/usr/bin/ffmpeg'
    args: ['-version']
    exitCode: 0
    expectedOutput: ['ffmpeg version']

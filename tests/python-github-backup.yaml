schemaVersion: '2.0.0'

fileExistenceTests:
  - name: 'github-backup binary exists'
    path: '/app/bin/github-backup'
    shouldExist: true
    permissions: '-rwxr-xr-x'
    uid: 0
    gid: 0

commandTests:
  - name: 'github-backup binary checksum'
    command: 'sha256sum'
    args: ['/app/bin/github-backup']
    expectedOutput:
      - '1b730319fc8fce75dcfe1a3aa97fc75b1593b3b75540671a745ecc40dbebe970'

  - name: 'github-backup help works'
    command: '/app/bin/github-backup'
    args: ['--help']
    exitCode: 0

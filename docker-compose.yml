---
version: "3"
services:
  tor:
    build: dockerfiles/tor
    image: bdossantos/tor
    container_name: tor
    read_only: true
    shm_size: 16M
    environment:
      - TZ=Europe/Paris
    ports:
      - 127.0.0.1:9050:9050/tcp
      - 127.0.0.1:9053:9053/udp
    restart: always

networks:
  default:
    driver: bridge

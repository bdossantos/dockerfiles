[global]
error_log = /proc/self/fd/2
log_level = warning
pid = /dev/shm/php-fpm.pid

[www]
user = nobody
group = nogroup
access.log = /dev/null
catch_workers_output = yes
clear_env = no
listen = 127.0.0.1:9000
listen.backlog = 65535
ping.path = /php-fpm-ping
ping.response = pong
pm = static
pm.max_children = 64
pm.max_requests = 1024
pm.status_path = /php-fpm-status
rlimit_files = 65535

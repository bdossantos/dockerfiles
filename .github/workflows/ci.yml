---
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly full rebuild: picks up base image security fixes and catches
    # pinned Debian packages that were removed from the archive.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; master runs are queued, never cancelled,
  # so an older build cannot overwrite tags pushed by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        id: python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dependencies
        run: make venv pip-install
      - name: pre-commit
        run: make pre-commit
      - name: shellcheck
        # shellcheck is preinstalled on GitHub-hosted Ubuntu runners
        run: make shellcheck
      - name: hadolint
        run: make dockerfile-lint

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Discover images to build
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;; # schedule, workflow_dispatch: rebuild everything
          esac
          matrix=$(scripts/discover-images "$base")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "selected: \(.name)"' <<<"$matrix"

  image:
    name: image (${{ matrix.name }})
    needs: [lint, discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      LOCAL_IMAGE: bdossantos/${{ matrix.service }}:ci${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Image metadata
        id: meta
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SERVICE: ${{ matrix.service }}
          SUFFIX: ${{ matrix.suffix }}
          VARIANT: ${{ matrix.variant }}
          LATEST: ${{ matrix.latest }}
        run: |
          version=$(grep -E '^\s*((ARG|ENV)\s+)?VERSION=' "$DOCKERFILE" \
            | tail -1 \
            | sed -E 's/^.*VERSION=([^ \\]+).*/\1/')
          vcs_ref=$(git rev-parse --short HEAD)
          repo="bdossantos/${SERVICE}"
          tags="${repo}:${version}${SUFFIX},${repo}:${version}-${vcs_ref}${SUFFIX},${repo}:${version%.*}${SUFFIX}"
          if [ "$LATEST" = "true" ]; then
            tags="${repo}:latest${SUFFIX},${tags}"
          fi
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # One cache per Dockerfile: php-lol 8.3/8.4/8.5 must not share it
            echo "cache_image=${repo}:buildcache${VARIANT:+-$VARIANT}${SUFFIX}"
            echo "tags=${tags}"
            echo "vcs_ref=${vcs_ref}"
          } >> "$GITHUB_OUTPUT"
          echo "tags: ${tags}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6.19.2
        with:
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_image }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        if: matrix.test != ''
        with:
          path: bin/container-structure-test
          key: ${{ runner.os }}-container-structure-test-${{ hashFiles('scripts/container-structure-test-install') }}

      - name: container-structure-test
        if: matrix.test != ''
        env:
          TEST_CONFIG: ${{ matrix.test }}
        run: |
          make container-structure-test-install
          bin/container-structure-test test --image "$LOCAL_IMAGE" --config "$TEST_CONFIG"

      - name: Smoke test
        if: matrix.smoke != ''
        env:
          SMOKE_TEST: ${{ matrix.smoke }}
        run: '"$SMOKE_TEST" "$LOCAL_IMAGE"'

      - name: Warn about untested image
        if: matrix.test == '' && matrix.smoke == ''
        env:
          NAME: ${{ matrix.name }}
        run: echo "::warning title=No tests::${NAME} has no container-structure-test config or smoke test"

      - name: dive
        # Informational until every image meets dive's default efficiency
        # thresholds: it was never effectively enforced before.
        continue-on-error: true
        run: CI=true scripts/dive "$LOCAL_IMAGE"

      # Publishing only happens once the image above passed every check. The
      # push build reuses the builder cache, so the layers are the ones tested.
      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # ratchet:docker/login-action@v3.7.0
        with:
          username: bdossantos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6.19.2
        with:
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.vcs_ref }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_image }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache_image }},mode=max
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
